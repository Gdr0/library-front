<section>
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold">Clienti</h1>

    <button mat-flat-button type="button" (click)="createClient()">
      Crea nuovo cliente
    </button>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-12">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }

  @if (error()) {
    <p class="text-red-600">{{ error() }}</p>
  }

  @if (!loading() && !error()) {
    <table mat-table [dataSource]="clients()" class="w-full">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let client">
          {{ client.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Cognome</th>
        <td mat-cell *matCellDef="let client">
          {{ client.last_name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef>Telefono</th>
        <td mat-cell *matCellDef="let client">
          {{ client.phone_number }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let client">
          {{ client.email }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="cursor-pointer"
        (click)="editClient(row)"
      ></tr>
    </table>

    <mat-paginator
      [length]="totalClients()"
      [pageIndex]="currentPage() - 1"
      [pageSize]="pageSize()"
      [hidePageSize]="true"
      (page)="changePage($event)"
    />
  }
</section>
